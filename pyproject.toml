[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heedwire"
version = "0.1.0"
description = "A simple, self-hostable security signal monitor for your stack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["security", "cve", "kev", "vulnerability", "monitoring", "msp", "rss"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Topic :: Security"]
# All permissive: requests Apache-2.0, feedparser BSD, PyYAML MIT, FastAPI/uvicorn MIT/BSD.
dependencies = ["requests>=2.31", "feedparser>=6.0", "PyYAML>=6.0",
                "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3", "httpx>=0.27"]

[project.scripts]
heedwire = "heedwire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
