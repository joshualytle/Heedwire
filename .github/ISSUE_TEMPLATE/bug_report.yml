name: Bug report
description: Report a problem so it can be reproduced and fixed.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Before you paste anything: redact secrets.**
        Remove webhook URLs, API keys, tokens, and your watchlist from any config
        or logs below. Issues are public. If this is a *security vulnerability*,
        do **not** file it here — see SECURITY.md and report it privately.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I removed all secrets (webhook URLs, keys, tokens, watchlist) from the details below.
          required: true
        - label: This is a bug, not a security vulnerability (those go to SECURITY.md).
          required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. 0.1.0 or commit a1b2c3d"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options: ["docker compose", "docker run", "from source (pip)", "other"]
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - "source: kev"
        - "source: rss / psirt"
        - "source: news"
        - "source: reddit"
        - "taxonomy / matching"
        - "output / webhook"
        - "local API"
        - "scheduler / heartbeat"
        - "summarizer"
        - "docker / deployment"
        - "other / not sure"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: Paste relevant output. REMOVE secrets first.
      render: shell
  - type: textarea
    id: config
    attributes:
      label: Sanitized config (optional)
      description: Your config.yaml with all secrets and watchlist removed.
      render: yaml
