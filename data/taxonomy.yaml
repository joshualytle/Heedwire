# Heedwire taxonomy — starter seed.
# Pick from these by category / vendor / product in config.yaml (watch:).
# Each entry maps one product to the keys each source type needs.
#
# NOTE: cpe vendor/product slugs are seeds — verify against the NVD CPE
# dictionary when expanding. alias_safety: exact | phrase | cooccur.
# Contributions welcome (see CONTRIBUTING.md).

# ---------------- Network Security / Firewalls ----------------
- id: fortinet.fortios
  vendor: Fortinet
  category: Network Security / Firewalls
  cpe: { vendor: fortinet, product: fortios }
  aliases: ["FortiOS", "FortiGate"]
  alias_safety: exact

